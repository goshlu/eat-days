<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一人食·川菜推荐官</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sichuan: { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
            primary: { 50: '#f0f5ff', 100: '#e0eaff', 200: '#c2d5ff', 400: '#7c9aff', 500: '#667eea', 600: '#5a67d8', 700: '#4c51bf' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f5f5f7; min-height: 100vh; }

    .gradient-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .gradient-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .gradient-btn:active { transform: scale(0.97); }

    .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

    .section-cook { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border-left: 4px solid #f97316; }
    .section-takeout { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-left: 4px solid #3b82f6; }
    .section-eatout { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-left: 4px solid #22c55e; }

    .spicy-btn { border: 2px solid #e5e7eb; transition: all 0.2s; }
    .spicy-btn.active { border-color: #667eea; background: #f0f5ff; transform: scale(1.05); }
    .spicy-btn:active { transform: scale(0.95); }

    .tag { display: inline-block; padding: 3px 12px; border-radius: 9999px; font-size: 12px; font-weight: 500; }

    .fade-in { animation: fadeInUp 0.5s ease-out; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .spinner { width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top: 3px solid #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .setting-toggle { transition: transform 0.3s; }
    .setting-toggle.collapsed { transform: rotate(-90deg); }

    .dish-item { position: relative; padding-left: 20px; }
    .dish-item::before { content: ''; position: absolute; left: 0; top: 8px; width: 8px; height: 8px; border-radius: 50%; }

    .history-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; background: #f3f4f6; border-radius: 9999px; font-size: 12px; color: #6b7280; }
    .history-chip .remove { cursor: pointer; color: #9ca3af; font-size: 14px; }
    .history-chip .remove:hover { color: #ef4444; }

    .streaming-cursor::after { content: '▍'; animation: blink 0.8s step-end infinite; color: #667eea; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

  <!-- 顶部 Header -->
  <header class="gradient-header text-white pt-12 pb-8 px-5 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-40 h-40 bg-white/5 rounded-full -translate-y-1/2 translate-x-1/2"></div>
    <div class="absolute bottom-0 left-0 w-24 h-24 bg-white/5 rounded-full translate-y-1/2 -translate-x-1/2"></div>
    <div class="relative z-10">
      <h1 class="text-2xl font-bold tracking-wide">🍜 一人食·川菜推荐官</h1>
      <p class="text-white/70 text-sm mt-1">专为独居青年打造的川味每日推荐</p>
      <p id="headerDate" class="text-white/60 text-xs mt-2"></p>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 -mt-4 relative z-10 pb-8">

    <!-- 设置面板 -->
    <div class="card p-5 mb-4">
      <div class="flex items-center justify-between mb-3" onclick="toggleSettings()">
        <h2 class="text-base font-semibold text-gray-800">⚙️ 偏好设置</h2>
        <svg id="settingsArrow" class="w-5 h-5 text-gray-400 setting-toggle transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>

      <div id="settingsBody">
        <!-- 辣度 -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-600 mb-2">🌶️ 辣度偏好</label>
          <div class="grid grid-cols-5 gap-2">
            <button onclick="setSpicy(1)" data-spicy="1" class="spicy-btn rounded-xl py-2 text-center">
              <div class="text-base">🌶</div><div class="text-[10px] text-gray-500 mt-0.5">微辣</div>
            </button>
            <button onclick="setSpicy(2)" data-spicy="2" class="spicy-btn rounded-xl py-2 text-center">
              <div class="text-base">🌶🌶</div><div class="text-[10px] text-gray-500 mt-0.5">中辣</div>
            </button>
            <button onclick="setSpicy(3)" data-spicy="3" class="spicy-btn rounded-xl py-2 text-center">
              <div class="text-base">🌶🌶🌶</div><div class="text-[10px] text-gray-500 mt-0.5">重辣</div>
            </button>
            <button onclick="setSpicy(4)" data-spicy="4" class="spicy-btn rounded-xl py-2 text-center">
              <div class="text-base">🔥🔥</div><div class="text-[10px] text-gray-500 mt-0.5">爆辣</div>
            </button>
            <button onclick="setSpicy(5)" data-spicy="5" class="spicy-btn rounded-xl py-2 text-center">
              <div class="text-base">💀🔥</div><div class="text-[10px] text-gray-500 mt-0.5">变态辣</div>
            </button>
          </div>
        </div>

        <!-- 忌口 -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-600 mb-2">🚫 忌口食材</label>
          <div class="flex flex-wrap gap-2 mb-2" id="dislikesTags"></div>
          <div class="flex gap-2">
            <input id="dislikeInput" type="text" placeholder="输入忌口，如：香菜" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent" onkeydown="if(event.key==='Enter'){addDislike();event.preventDefault();}">
            <button onclick="addDislike()" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 active:scale-95 transition-all">添加</button>
          </div>
        </div>

        <!-- API Key -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-600 mb-2">🔑 API Key <span class="text-gray-400 font-normal">（可选，留空使用本地推荐）</span></label>
          <input id="apiKeyInput" type="password" placeholder="DeepSeek / OpenAI API Key" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent">
        </div>

        <!-- API Provider 选择 -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-600 mb-2">🤖 AI 服务商</label>
          <div class="flex gap-2">
            <button onclick="setProvider('deepseek')" data-provider="deepseek" class="provider-btn flex-1 py-2 rounded-lg border-2 border-gray-200 text-sm font-medium transition-all">DeepSeek</button>
            <button onclick="setProvider('openai')" data-provider="openai" class="provider-btn flex-1 py-2 rounded-lg border-2 border-gray-200 text-sm font-medium transition-all">OpenAI</button>
          </div>
        </div>

        <button onclick="saveSettings()" class="w-full gradient-btn text-white py-2.5 rounded-xl text-sm font-semibold active:scale-[0.98] transition-transform">
          保存设置
        </button>
      </div>
    </div>

    <!-- 推荐结果区 -->
    <div id="recommendArea">
      <!-- 空状态 -->
      <div id="emptyState" class="card p-8 text-center mb-4">
        <div class="text-5xl mb-3">🍜</div>
        <p class="text-gray-400 text-sm">点击下方按钮，获取今日专属推荐</p>
      </div>

      <!-- 加载状态 -->
      <div id="loadingState" class="hidden card p-8 text-center mb-4">
        <div class="spinner mx-auto mb-3"></div>
        <p id="loadingText" class="text-gray-400 text-sm">川菜大师正在为你精心挑选…</p>
      </div>

      <!-- 推荐卡片 -->
      <div id="resultCard" class="hidden card overflow-hidden mb-4 fade-in">
        <!-- 日期头 -->
        <div class="gradient-header px-5 py-3">
          <h3 id="resultDate" class="text-white font-bold text-base"></h3>
        </div>

        <div class="p-5 space-y-5">
          <!-- 做饭 -->
          <div>
            <div class="flex items-center gap-2 mb-2.5">
              <span class="text-xl">👩‍🍳</span>
              <h4 class="font-semibold text-gray-800 text-sm">今日做饭</h4>
              <span class="tag bg-orange-100 text-orange-600">≤30分钟</span>
            </div>
            <div class="section-cook rounded-xl p-4 space-y-2">
              <div class="font-bold text-orange-800 text-base" id="cookDish"></div>
              <div class="text-sm text-gray-600 leading-relaxed" id="cookReason"></div>
              <div class="text-sm text-orange-700 font-medium" id="cookTip"></div>
              <div class="text-xs text-gray-500 bg-white/60 rounded-lg px-3 py-2" id="cookIngredients"></div>
            </div>
          </div>

          <!-- 外卖 -->
          <div>
            <div class="flex items-center gap-2 mb-2.5">
              <span class="text-xl">🛵</span>
              <h4 class="font-semibold text-gray-800 text-sm">今日外卖</h4>
              <span class="tag bg-blue-100 text-blue-600">单人餐</span>
            </div>
            <div class="section-takeout rounded-xl p-4 space-y-2">
              <div class="font-bold text-blue-800 text-base" id="takeoutDish"></div>
              <div class="text-sm text-gray-600 leading-relaxed" id="takeoutReason"></div>
              <div class="text-sm text-blue-700 font-medium" id="takeoutTip"></div>
            </div>
          </div>

          <!-- 出去吃 -->
          <div>
            <div class="flex items-center gap-2 mb-2.5">
              <span class="text-xl">🚶</span>
              <h4 class="font-semibold text-gray-800 text-sm">出去吃</h4>
              <span class="tag bg-green-100 text-green-600">单人友好</span>
            </div>
            <div class="section-eatout rounded-xl p-4 space-y-2">
              <div class="font-bold text-green-800 text-sm" id="eatoutType"></div>
              <div class="text-sm text-gray-600 leading-relaxed" id="eatoutDish"></div>
              <div class="text-sm text-green-700 font-medium" id="eatoutTip"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="flex gap-3 mb-5">
      <button onclick="generate()" class="flex-1 gradient-btn text-white py-3.5 rounded-xl text-base font-bold active:scale-[0.97] transition-transform shadow-lg shadow-purple-500/20">
        🎲 今天吃什么
      </button>
      <button onclick="refresh()" class="w-[52px] h-[52px] card flex items-center justify-center active:scale-95 transition-transform" title="换一天">
        <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>

    <!-- 历史黑名单 -->
    <div class="card p-5 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-gray-700">📋 最近7天已推荐 <span id="historyCount" class="text-gray-400 font-normal">(0)</span></h2>
        <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-500 active:scale-95 transition-all">清空</button>
      </div>
      <div id="historyList" class="flex flex-wrap gap-2">
        <span class="text-gray-300 text-xs">暂无记录</span>
      </div>
    </div>

    <!-- 本地菜品库预览 -->
    <div class="card p-5 mb-4">
      <div class="flex items-center justify-between mb-3" onclick="toggleDishLib()">
        <h2 class="text-sm font-semibold text-gray-700">📚 内置川菜库 <span class="text-gray-400 font-normal">(本地推荐模式使用)</span></h2>
        <svg id="dishLibArrow" class="w-5 h-5 text-gray-400 setting-toggle collapsed transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
      <div id="dishLibBody" class="hidden">
        <div id="dishLibContent" class="text-sm text-gray-500 leading-relaxed"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-300 py-4">
      <p>一人食·川菜推荐官 v1.0</p>
      <p class="mt-1">MIT © 2026 · 川味不将就</p>
    </footer>
  </main>

<script>
// ============================================================
// 一人食·川菜推荐官 — 核心逻辑
// ============================================================

// ---- 常量 ----
const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
const STORAGE_KEY = 'sichuan_solo_prefs';
const HISTORY_KEY = 'sichuan_solo_history';
const HISTORY_TTL = 7 * 24 * 60 * 60 * 1000; // 7天

// ---- 内置川菜菜品库（本地推荐模式） ----
const DISH_DB = {
  cook: [
    { dish: '麻婆豆腐', reason: '经典川菜，嫩滑入味，下饭神器', tip: '秘诀：先炒肉末出油，再下豆瓣酱炒红油，最后放豆腐轻推不要翻', ingredients: '嫩豆腐 1块、猪肉末 100g、郫县豆瓣酱 1勺、花椒粉少许' },

    { dish: '酸辣土豆丝', reason: '清脆爽口，酸辣过瘾，成本不到5块钱', tip: '秘诀：土豆丝泡水去淀粉，大火快炒保持脆感', ingredients: '土豆 1个、干辣椒 3个、醋 1勺' },
    { dish: '水煮肉片', reason: '麻辣鲜香，肉片嫩滑，一个人的火锅盛宴', tip: '秘诀：肉片用蛋清和淀粉抓匀，最后泼热油激香', ingredients: '猪里脊 200g、豆芽 100g、干辣椒、花椒' },

    { dish: '豆花饭', reason: '重庆街头最朴素的美味，一碗豆花一碗饭', tip: '秘诀：内酯豆腐直接用，蘸碟加辣椒面和花椒面', ingredients: '内酯豆腐 1盒、米饭 1碗、辣椒面、花椒面、葱花' },

  takeout: [

    { dish: '钵钵鸡·红油味', reason: '签签计费想吃多少拿多少，完美一人食', tip: '凑单建议：荤素各5签 + 一碗鸡汤饭 ≈ 25元' },
    { dish: '重庆小面', reason: '麻辣鲜香一碗搞定，外卖出餐快口感稳', tip: '凑单建议：加个煎蛋 + 冰粉 ≈ 18元' },
    { dish: '冒菜（单人份）', reason: '一个人的火锅，想吃啥冒啥', tip: '凑单建议：加毛肚和鸭血，配米饭 ≈ 25元' },
    { dish: '卤肉饭·川味版', reason: '米饭杀手，卤肉配辣椒酱更有川味', tip: '凑单建议：加卤蛋和卤豆干 ≈ 20元' },
    { dish: '干拌抄手', reason: '红油拌抄手比汤的更香，外卖不怕坨', tip: '凑单建议：加一碗银耳汤 ≈ 16元' },
    { dish: '酸辣粉', reason: '酸辣过瘾，外卖必备经典款', tip: '凑单建议：加个肉夹馍 ≈ 18元' },
    { dish: '黄焖鸡米饭', reason: '鸡肉嫩滑汤汁浓郁，拌饭一绝', tip: '凑单建议：加一份青菜 ≈ 20元' },
    { dish: '肥肠粉+锅盔', reason: '成都经典街头搭配，粉糯锅盔脆', tip: '凑单建议：肥肠粉+鲜肉锅盔+豆浆 ≈ 22元' },

    { dish: '街边面馆', reason: '成都人的一天从一碗面开始，一个人吃面最自在', tip: '推荐菜品：素椒杂酱面 / 红油抄手 | 单人友好：随便找个位子坐下就吃' },

    { dish: '兔头店', reason: '成都人最爱的零食，一个人啃兔头最过瘾', tip: '推荐菜品：麻辣兔头2个 + 冰粉 | 单人友好：本就是一个人的零嘴' },
    { dish: '甜水面店', reason: '粗面条甜辣口，成都独有的小吃体验', tip: '推荐菜品：甜水面 + 凉粉 | 单人友好：小吃店，吃完就走不尴尬' },
    { dish: '跷脚牛肉', reason: '乐山名菜，汤鲜肉嫩，一个人也能喝汤吃肉', tip: '推荐菜品：小碗跷脚牛肉 + 血旺 | 单人友好：清汤锅底，一人一锅' },
    { dish: '烤鱼（小份）', reason: '很多烤鱼店有单人小份，比大份划算', tip: '推荐菜品：麻辣烤鱼小份 + 米饭 | 单人友好：提前问有没有小份' },

};

// ---- 状态 ----
let state = {
  spicyLevel: 3,
  dislikes: [],
  apiKey: '',
  provider: 'deepseek',
  settingsOpen: true,
  dishLibOpen: false,
};

let history = []; // [{dish, date}]

// ---- 初始化 ----
function init() {
  loadPrefs();
  loadHistory();
  updateHeaderDate();
  renderSpicyButtons();
  renderDislikes();
  renderHistory();
  renderDishLib();
  document.getElementById('apiKeyInput').value = state.apiKey;
}

function updateHeaderDate() {
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${WEEKDAYS[now.getDay()]}`;
  document.getElementById('headerDate').textContent = dateStr;
}

// ---- 本地存储 ----
function loadPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) Object.assign(state, saved);
  } catch(e) {}
}

function savePrefs() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    spicyLevel: state.spicyLevel,
    dislikes: state.dislikes,
    apiKey: state.apiKey,
    provider: state.provider,
  }));
}

function loadHistory() {
  try {
    const raw = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    const now = Date.now();
    history = raw.filter(h => now - h.date < HISTORY_TTL);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch(e) { history = []; }
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function addHistoryDish(name) {
  if (!history.find(h => h.dish === name)) {
    history.push({ dish: name, date: Date.now() });
    saveHistory();
    renderHistory();
  }
}

function getBlacklist() {
  return history.map(h => h.dish);
}

// ---- 设置 UI ----
function toggleSettings() {
  state.settingsOpen = !state.settingsOpen;
  const body = document.getElementById('settingsBody');
  const arrow = document.getElementById('settingsArrow');
  if (state.settingsOpen) {
    body.classList.remove('hidden');
    arrow.classList.remove('collapsed');
  } else {
    body.classList.add('hidden');
    arrow.classList.add('collapsed');
  }
}

function toggleDishLib() {
  state.dishLibOpen = !state.dishLibOpen;
  const body = document.getElementById('dishLibBody');
  const arrow = document.getElementById('dishLibArrow');
  if (state.dishLibOpen) {
    body.classList.remove('hidden');
    arrow.classList.remove('collapsed');
  } else {
    body.classList.add('hidden');
    arrow.classList.add('collapsed');
  }
}

function setSpicy(level) {
  state.spicyLevel = level;
  renderSpicyButtons();
}

function renderSpicyButtons() {
  document.querySelectorAll('.spicy-btn').forEach(btn => {
    const lv = parseInt(btn.dataset.spicy);
    btn.classList.toggle('active', lv === state.spicyLevel);
  });
}

function setProvider(p) {
  state.provider = p;
  renderProviderButtons();
}

function renderProviderButtons() {
  document.querySelectorAll('.provider-btn').forEach(btn => {
    const p = btn.dataset.provider;
    if (p === state.provider) {
      btn.classList.add('border-purple-500', 'bg-purple-50', 'text-purple-700');
      btn.classList.remove('border-gray-200');
    } else {
      btn.classList.remove('border-purple-500', 'bg-purple-50', 'text-purple-700');
      btn.classList.add('border-gray-200');
    }
  });
}

function addDislike() {
  const input = document.getElementById('dislikeInput');
  const val = input.value.trim();
  if (val && !state.dislikes.includes(val)) {
    state.dislikes.push(val);
    renderDislikes();
    input.value = '';
  }
}

function removeDislike(name) {
  state.dislikes = state.dislikes.filter(d => d !== name);
  renderDislikes();
}

function renderDislikes() {
  const container = document.getElementById('dislikesTags');
  if (state.dislikes.length === 0) {
    container.innerHTML = '<span class="text-gray-300 text-xs">无忌口</span>';
  } else {
    container.innerHTML = state.dislikes.map(d =>
      `<span class="history-chip">${d} <span class="remove" onclick="removeDislike('${d}')">&times;</span></span>`
    ).join('');
  }
}

function saveSettings() {
  state.apiKey = document.getElementById('apiKeyInput').value.trim();
  savePrefs();
  showToast('设置已保存 ✅');
}

function clearHistory() {
  if (confirm('确定清空所有历史记录？')) {
    history = [];
    saveHistory();
    renderHistory();
    showToast('历史已清空');
  }
}

function renderHistory() {
  const container = document.getElementById('historyList');
  document.getElementById('historyCount').textContent = `(${history.length})`;
  if (history.length === 0) {
    container.innerHTML = '<span class="text-gray-300 text-xs">暂无记录</span>';
  } else {
    container.innerHTML = history.map(h =>
      `<span class="history-chip">${h.dish}</span>`
    ).join('');
  }
}

function renderDishLib() {
  const el = document.getElementById('dishLibContent');
  const cookNames = DISH_DB.cook.map(d => d.dish).join('、');
  const takeoutNames = DISH_DB.takeout.map(d => d.dish).join('、');
  const eatoutNames = DISH_DB.eatout.map(d => d.dish).join('、');
  el.innerHTML = `
    <p class="mb-2"><strong>👩‍🍳 做饭 (${DISH_DB.cook.length}道)：</strong>${cookNames}</p>
    <p class="mb-2"><strong>🛵 外卖 (${DISH_DB.takeout.length}种)：</strong>${takeoutNames}</p>
    <p><strong>🚶 出去吃 (${DISH_DB.eatout.length}处)：</strong>${eatoutNames}</p>
  `;
}

// ---- Toast 提示 ----
function showToast(msg) {
  const existing = document.querySelector('.toast-msg');
  if (existing) existing.remove();

  const el = document.createElement('div');
  el.className = 'toast-msg fixed top-4 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-lg z-50 fade-in';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ---- 推荐生成 ----
function generate() {
  if (state.apiKey) {
    generateFromAPI();
  } else {
    generateLocal();
  }
}

function refresh() {
  // 换一天：移除今天的推荐后重新生成
  const today = new Date().toISOString().slice(0, 10);
  history = history.filter(h => {
    const hDate = new Date(h.date).toISOString().slice(0, 10);
    return hDate !== today;
  });
  saveHistory();
  renderHistory();
  generate();
}

// ---- 本地推荐 ----
function generateLocal() {
  showLoading();
  const blacklist = getBlacklist();

  // 从菜品库中过滤掉黑名单，随机选取
  const pick = (arr, count = 1) => {
    const filtered = arr.filter(d => !blacklist.includes(d.dish));
    const pool = filtered.length >= count ? filtered : arr; // 不够就从全量里选
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, count);
  };

  const [cook] = pick(DISH_DB.cook);
  const [takeout] = pick(DISH_DB.takeout);
  const [eatout] = pick(DISH_DB.eatout);

  // 模拟延迟
  setTimeout(() => {
    const now = new Date();
    const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${WEEKDAYS[now.getDay()]}`;

    renderResult(dateStr, {
      cookDish: cook.dish,
      cookReason: cook.reason,
      cookTip: '💡 ' + cook.tip,
      cookIngredients: '🛒 ' + cook.ingredients,
      takeoutDish: takeout.dish,
      takeoutReason: takeout.reason,
      takeoutTip: '💰 ' + takeout.tip,
      eatoutType: eatout.dish,
      eatoutDish: eatout.reason,
      eatoutTip: '📍 ' + eatout.tip,
    });

    // 记录历史
    addHistoryDish(cook.dish);
    addHistoryDish(takeout.dish);
  }, 600);
}

// ---- API 推荐（流式） ----
async function generateFromAPI() {
  showLoading();
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${WEEKDAYS[now.getDay()]}`;
  const blacklist = getBlacklist();

  const spicyDesc = ['', '微辣（几乎不辣）', '中辣（能接受一般辣度）', '重辣（无辣不欢）', '爆辣（辣椒当饭吃）', '变态辣（挑战极限）'][state.spicyLevel];

  const systemPrompt = `你是一位精通川菜美食、深谙一人食场景的AI推荐官。
你的使命是帮助用户解决"每天吃什么"的终极难题。

当前日期：${dateStr}
用户辣度偏好：${spicyDesc}（${state.spicyLevel}/5）
忌口清单：${state.dislikes.join('、') || '无'}
最近7天已推荐的菜品（严禁重复）：${blacklist.join('、') || '无'}

行为约束：
❌ 不推荐需要复杂刀工或稀缺调料的菜品（如开水白菜）
❌ 外卖不推荐必须现场吃才好吃的菜（如锅巴肉片、炸酥肉）
❌ 出去吃不推荐需要排队1小时以上的网红店
✅ 做饭菜品操作时间应≤30分钟（新手友好）
✅ 做饭菜品主料≤3种、成本≤20元
✅ 外卖优先推荐有单人餐的店铺
✅ 出去吃推荐小份菜或拼桌友好的餐厅
✅ 若用户忌口清单非空，生成时必须避开相关食材

请严格按以下JSON格式输出，不要输出其他内容：
{
  "cookDish": "菜品名",
  "cookReason": "推荐理由（一句话）",
  "cookTip": "快手秘籍（一句话）",
  "cookIngredients": "食材清单（单人份）",
  "takeoutDish": "外卖推荐（店铺类型+菜品）",
  "takeoutReason": "推荐理由（一句话）",
  "takeoutTip": "凑单小贴士（含预算）",
  "eatoutType": "推荐餐厅类型",
  "eatoutDish": "必点菜品及理由",
  "eatoutTip": "单人友好提示"
}`;

  try {
    let url, headers, body;

    if (state.provider === 'deepseek') {
      url = 'https://api.deepseek.com/v1/chat/completions';
      headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.apiKey}` };
      body = JSON.stringify({
        model: 'deepseek-chat',
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: '请生成今日一人食川菜推荐。' }],
        temperature: 0.85,
        stream: true,
      });
    } else {
      url = 'https://api.openai.com/v1/chat/completions';
      headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.apiKey}` };
      body = JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: '请生成今日一人食川菜推荐。' }],
        temperature: 0.85,
        stream: true,
      });
    }

    const response = await fetch(url, { method: 'POST', headers, body });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API 请求失败 (${response.status}): ${errText}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let buffer = '';

    document.getElementById('loadingText').innerHTML = '<span class="streaming-cursor">AI 正在生成推荐</span>';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
          try {
            const json = JSON.parse(line.slice(6));
            const delta = json.choices?.[0]?.delta?.content || '';
            fullContent += delta;
            document.getElementById('loadingText').innerHTML = `<span class="streaming-cursor">正在生成… (${fullContent.length}字)</span>`;
          } catch(e) {}
        }
      }
    }

    // 解析 JSON 结果
    const parsed = parseAIResult(fullContent);
    renderResult(dateStr, parsed);

    // 记录历史
    if (parsed.cookDish) addHistoryDish(parsed.cookDish);
    if (parsed.takeoutDish) addHistoryDish(parsed.takeoutDish);

  } catch (err) {
    hideLoading();
    showToast('⚠️ ' + err.message);
    console.error(err);
  }
}

function parseAIResult(text) {
  // 尝试提取 JSON
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (jsonMatch) {
    try {
      return JSON.parse(jsonMatch[0]);
    } catch(e) {}
  }
  // 降级：从 markdown 解析
  return {
    cookDish: extractField(text, '推荐菜'),
    cookReason: extractField(text, '理由'),
    cookTip: extractField(text, '快手秘籍'),
    cookIngredients: extractField(text, '食材'),
    takeoutDish: extractField(text, '推荐点'),
    takeoutReason: extractField(text, '推荐理由') || extractField(text, '理由'),
    takeoutTip: extractField(text, '凑单'),
    eatoutType: extractField(text, '餐厅类型'),
    eatoutDish: extractField(text, '必点'),
    eatoutTip: extractField(text, '单人友好'),
  };
}

function extractField(text, key) {
  const regex = new RegExp(`${key}[：:](.+)`, 'i');
  const match = text.match(regex);
  return match ? match[1].trim() : '—';
}

// ---- 渲染结果 ----
function renderResult(dateStr, data) {
  document.getElementById('resultDate').textContent = '🗓 ' + dateStr + ' 推荐';

  document.getElementById('cookDish').textContent = '🍽 ' + data.cookDish;
  document.getElementById('cookReason').textContent = data.cookReason;
  document.getElementById('cookTip').textContent = '💡 ' + data.cookTip;
  document.getElementById('cookIngredients').textContent = '🛒 ' + data.cookIngredients;

  document.getElementById('takeoutDish').textContent = '🍜 ' + data.takeoutDish;
  document.getElementById('takeoutReason').textContent = data.takeoutReason;
  document.getElementById('takeoutTip').textContent = '💰 ' + data.takeoutTip;

  document.getElementById('eatoutType').textContent = '🏪 ' + data.eatoutType;
  document.getElementById('eatoutDish').textContent = data.eatoutDish;
  document.getElementById('eatoutTip').textContent = '📍 ' + data.eatoutTip;

  hideLoading();
  document.getElementById('emptyState').classList.add('hidden');
  const card = document.getElementById('resultCard');
  card.classList.remove('hidden');
  card.classList.add('fade-in');
}

// ---- Loading ----
function showLoading() {
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('loadingState').classList.remove('hidden');
  document.getElementById('loadingText').textContent = '川菜大师正在为你精心挑选…';
}

function hideLoading() {
  document.getElementById('loadingState').classList.add('hidden');
}

// ---- 启动 ----
document.addEventListener('DOMContentLoaded', init);
</script>
